<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sala Aurora VR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#1b1a22; --card:rgba(251,250,247,.94); --ink:#1f2b33; --muted:#5f6d75; --teal:#2fa89b; --coral:#e8735a; --line:rgba(31,43,51,.14);
  --fd:"Outfit",system-ui,sans-serif; --fb:"Nunito",system-ui,sans-serif; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a22}}
:root[data-theme="dark"]{--bg:#1b1a22}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
#top{position:fixed;left:12px;right:12px;top:calc(10px + var(--st));display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.brand{padding:8px 13px}
.brand b{display:block;font:800 15px var(--fd);letter-spacing:.02em}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.seg{display:flex;padding:4px;gap:4px}
button{font:700 13px var(--fb);color:var(--ink);background:transparent;border:0;border-radius:12px;padding:9px 13px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
#vr{background:var(--coral);color:#fff;border-radius:14px;padding:11px 16px;font:700 13px var(--fd);box-shadow:0 6px 18px rgba(232,115,90,.35)}
#vr:disabled{background:var(--card);color:var(--muted);box-shadow:none;border:1px solid var(--line)}
#hint{position:fixed;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);padding:10px 16px;font-size:13px;color:var(--ink);max-width:calc(100% - 24px);text-align:center;transition:opacity .35s}
#hint.hide{opacity:0;pointer-events:none}
#hint.err{color:#b3261e}
#sheet{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sb));padding:12px 14px;max-height:45vh;overflow:auto;display:none}
#sheet.show{display:block}
#sheet .row{display:flex;gap:6px;align-items:center}
#sheet .tt{flex:1;min-width:0}
#sType{font:700 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
#sName{margin:1px 0 0;font:800 22px/1.1 var(--fd)}
#sheet .row button{width:34px;height:34px;padding:0;font-size:17px;background:#eef3f2}
#sStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:9px}
.st{border-radius:10px;padding:6px 8px;background:#e9f5f3}
.st small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st b{display:block;margin-top:2px;font-size:12.5px}
#sDesc{margin:9px 0 0;font-size:13.5px;line-height:1.45}
#sCur{margin:8px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.45;color:#3a4a52}
#sCur li{padding-left:16px;position:relative;margin-top:4px}
#sCur li::before{content:"●";position:absolute;left:0;color:var(--coral);font-size:9px;top:4px}
@media (orientation:landscape){ #sheet{display:none!important} }
@media (max-width:520px){ .brand span{display:none} #top{justify-content:center} }
</style></head><body>
<canvas id="c"></canvas>
<header id="top">
  <div class="brand card"><b>Sala Aurora</b><span>Laboratório de ciências</span></div>
  <div class="seg card" role="group" aria-label="Aula">
    <button data-l="solar" aria-pressed="true">Sistema Solar</button>
    <button data-l="cell" aria-pressed="false">Célula</button>
  </div>
  <button id="vr" disabled>Entrar em VR</button>
</header>
<div id="hint" class="card">Toque num item da mesa · arraste para olhar · pinça para zoom</div>
<section id="sheet" class="card" aria-live="polite">
  <div class="row"><button id="sPrev" aria-label="Anterior">‹</button><div class="tt"><div id="sType"></div><h1 id="sName"></h1></div><button id="sNext" aria-label="Próximo">›</button><button id="sBack" aria-label="Voltar">⟲</button></div>
  <div id="sStats"></div><p id="sDesc"></p><ul id="sCur"></ul>
</section>
<script>
(function(){
'use strict';
var hintEl = document.getElementById('hint');
function fail(e){ hintEl.className = 'glass err'; hintEl.textContent = 'Erro: ' + (e && e.message ? e.message : e); console.error(e); }
window.addEventListener('error', function(e){ fail(e.error || e.message); });
try {

/* ================= SHADERS ================= */
var NOISE = [
'float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }',
'float noise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);',
' return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),',
'            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }',
'float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s/0.97; }',
'vec3 hash3(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6))); return fract(sin(p)*43758.5453); }',
'float craters(vec3 p){ vec3 i=floor(p); vec3 f=fract(p); float res=0.0;',
' for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++) for(int z=-1;z<=1;z++){',
'  vec3 g=vec3(float(x),float(y),float(z)); vec3 o=hash3(i+g); float r=0.12+0.28*o.x; float d=length(g+o-f)/r;',
'  if(d<1.2){ res+= smoothstep(0.75,1.0,d)*(1.0-smoothstep(1.0,1.2,d))*0.55 - (1.0-smoothstep(0.0,0.85,d))*0.32*step(0.35,o.y); } }',
' return res; }'
].join('\n');

var VS_SPHERE = [
'attribute vec3 position;',
'uniform mat4 uVP; uniform mat4 uModel;',
'varying vec3 vObjN; varying vec3 vWorldPos; varying vec3 vWorldN;',
'void main(){ vObjN=position; vec4 w=uModel*vec4(position,1.0); vWorldPos=w.xyz; vWorldN=(uModel*vec4(position,0.0)).xyz; gl_Position=uVP*w; }'
].join('\n');

var FS_PLANET = 'precision highp float;\n' + NOISE + '\n' + [
'varying vec3 vObjN; varying vec3 vWorldPos; varying vec3 vWorldN;',
'uniform int uType; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3; uniform vec3 uAtm; uniform float uAtmStr;',
'uniform float uSeed; uniform float uTime; uniform float uFreq; uniform float uContrast; uniform float uCloudRot;',
'uniform vec4 uSpot; uniform vec3 uSpotC; uniform float uSpotOn;',
'uniform vec3 uSunPos; uniform vec3 uCamPos; uniform vec3 uNeon;',
'uniform vec3 uRingN; uniform vec3 uPlanetPos; uniform vec2 uRingR; uniform float uRingOn;',
'void main(){',
' vec3 n=normalize(vObjN); vec3 p=n+vec3(uSeed); float lat=n.y; float lon=atan(n.z,n.x);',
' vec3 col=uC1; float specM=0.0; float lights=0.0; float cloud=0.0;',
' if(uType==0||uType==6){',
'  float h=fbm(p*2.5); float d=fbm(p*8.0+3.0);',
'  col=mix(uC2,uC1,smoothstep(0.25,0.75,h)); col=mix(col,uC3,smoothstep(0.55,0.8,d)*0.5);',
'  col*=1.0+craters(p*4.0)+craters(p*10.0+5.0)*0.6+craters(p*22.0+9.0)*0.3;',
' } else if(uType==1){',
'  vec3 q=p*1.4; q+=vec3(fbm(q*2.0+uTime*0.01),fbm(q*2.0+4.0),fbm(q*2.0+8.0))*1.3;',
'  float f=fbm(q*1.5+vec3(0.0,lat*3.0,0.0));',
'  col=mix(uC2,uC1,smoothstep(0.2,0.8,f)); col=mix(col,uC3,smoothstep(0.55,0.8,fbm(q*4.0))*0.55);',
' } else if(uType==2){',
'  float h=fbm(p*1.6)+0.18*fbm(p*7.0); float m=fbm(p*5.0+2.0);',
'  float land=smoothstep(0.585,0.6,h);',
'  vec3 ocean=mix(vec3(0.004,0.025,0.10),vec3(0.02,0.16,0.36),smoothstep(0.35,0.59,h));',
'  vec3 green=mix(vec3(0.06,0.20,0.06),vec3(0.20,0.30,0.11),m);',
'  vec3 landc=mix(green,vec3(0.58,0.47,0.29),smoothstep(0.5,0.66,m+0.12*(1.0-abs(lat)*2.0)));',
'  landc=mix(landc,vec3(0.36,0.31,0.27),smoothstep(0.72,0.85,h));',
'  col=mix(ocean,landc,land);',
'  float ice=smoothstep(0.8,0.86,abs(lat)+(m-0.5)*0.22); col=mix(col,vec3(0.92,0.95,1.0),ice);',
'  specM=(1.0-land)*(1.0-ice);',
'  lights=land*(1.0-ice)*smoothstep(0.6,0.82,noise(p*42.0))*smoothstep(0.42,0.62,fbm(p*9.0));',
'  float cr=uCloudRot; vec3 cn=vec3(n.x*cos(cr)-n.z*sin(cr),n.y,n.x*sin(cr)+n.z*cos(cr));',
'  vec3 cq=cn*2.2+vec3(uSeed+5.0); cq+=vec3(fbm(cq*2.0),fbm(cq*2.0+3.0),0.0)*0.6;',
'  cloud=smoothstep(0.5,0.78,fbm(cq*1.8+vec3(0.0,lat*2.0,0.0)))*0.92;',
' } else if(uType==3){',
'  float h=fbm(p*2.2); float d=fbm(p*6.0+1.0);',
'  col=mix(uC2,uC1,smoothstep(0.3,0.65,h)); col=mix(col,uC3,smoothstep(0.55,0.75,d)*0.45);',
'  col*=1.0+craters(p*5.0)*0.45+craters(p*12.0+4.0)*0.25;',
'  float ice=smoothstep(0.86,0.9,abs(lat)+(d-0.5)*0.12); col=mix(col,vec3(0.95,0.93,0.9),ice);',
' } else {',
'  vec3 w=p+vec3(fbm(p*vec3(2.0,6.0,2.0)),fbm(p*vec3(2.0,6.0,2.0)+7.0),0.0)*0.25*uContrast;',
'  float b=sin((lat+(fbm(w*vec3(1.5,9.0,1.5))-0.5)*0.16*uContrast)*uFreq)*0.5+0.5;',
'  col=mix(uC1,uC2,b*uContrast+(1.0-uContrast)*0.35);',
'  col=mix(col,uC3,smoothstep(0.5,0.85,fbm(w*vec3(3.0,16.0,3.0)))*0.45*uContrast);',
' }',
' if(uSpotOn>0.0){',
'  float dl=lon-uSpot.x; dl=atan(sin(dl),cos(dl)); vec2 e=vec2(dl/uSpot.z,(lat-uSpot.y)/uSpot.w); float r=length(e);',
'  float ang=atan(e.y,e.x)+r*3.0; float sw=fbm(vec3(cos(ang)*r*3.0,sin(ang)*r*3.0,uSeed));',
'  col=mix(col,uSpotC*(0.75+0.5*sw),smoothstep(1.0,0.55,r));',
' }',
' vec3 N=normalize(vWorldN); vec3 L=normalize(uSunPos-vWorldPos); vec3 V=normalize(uCamPos-vWorldPos);',
' float nl=dot(N,L); float diff=smoothstep(-0.08,0.55,nl);',
' if(uRingOn>0.0){',
'  float t=dot(uPlanetPos-vWorldPos,uRingN)/dot(L,uRingN);',
'  if(t>0.0){ vec3 hp=vWorldPos+L*t; float rr=length(hp-uPlanetPos); if(rr>uRingR.x&&rr<uRingR.y) diff*=0.45+0.4*noise(vec3(rr*30.0,0.0,0.0)); }',
' }',
' vec3 c=col*(diff*1.12+0.018);',
' if(specM>0.0){ vec3 H=normalize(L+V); c+=vec3(1.0,0.92,0.78)*pow(max(dot(N,H),0.0),70.0)*specM*0.8*smoothstep(0.0,0.2,nl); }',
' c+=vec3(1.0,0.72,0.35)*lights*smoothstep(0.08,-0.2,nl)*1.5;',
' if(cloud>0.0) c=mix(c,vec3(1.0)*(diff*1.05+0.012),cloud);',
' float fr=pow(1.0-max(dot(N,V),0.0),3.0);',
' c+=uAtm*fr*uAtmStr*smoothstep(-0.25,0.5,nl);',
' c+=uNeon*pow(1.0-max(dot(N,V),0.0),4.0);',
' gl_FragColor=vec4(c,1.0);',
'}'
].join('\n');

var FS_SUN = 'precision highp float;\n' + NOISE + '\n' + [
'varying vec3 vObjN; varying vec3 vWorldPos; varying vec3 vWorldN; uniform float uTime; uniform vec3 uCamPos;',
'void main(){ vec3 n=normalize(vObjN); vec3 p=n*4.0;',
' float g=fbm(p+vec3(uTime*0.05)); float g2=fbm(p*3.2-vec3(uTime*0.08)); float t=g*0.6+g2*0.4;',
' vec3 col=mix(vec3(1.0,0.32,0.03),vec3(1.0,0.78,0.35),smoothstep(0.3,0.72,t));',
' col=mix(col,vec3(1.0,0.98,0.85),smoothstep(0.68,0.88,t));',
' vec3 N=normalize(vWorldN); vec3 V=normalize(uCamPos-vWorldPos); float mu=max(dot(N,V),0.0);',
' col*=0.5+0.65*pow(mu,0.45); gl_FragColor=vec4(col*1.1,1.0); }'
].join('\n');

var FS_ATM = 'precision highp float;\n' + [
'varying vec3 vObjN; varying vec3 vWorldPos; varying vec3 vWorldN;',
'uniform vec3 uAtm; uniform float uStr; uniform vec3 uSunPos; uniform vec3 uCamPos; uniform float uEdge;',
'void main(){ vec3 N=normalize(vWorldN); vec3 V=normalize(uCamPos-vWorldPos); vec3 L=normalize(uSunPos-vWorldPos);',
' float d=max(dot(N,V),0.0); float f=smoothstep(0.0,uEdge,d)*pow(1.0-d,2.6);',
' float lit=smoothstep(-0.45,0.55,dot(N,L));',
' gl_FragColor=vec4(uAtm*f*uStr*lit*2.2,1.0); }'
].join('\n');

var VS_RING = [
'attribute vec2 aRing; uniform mat4 uVP; uniform mat4 uModel; uniform vec2 uR;',
'varying float vT; varying vec3 vWorld;',
'void main(){ float r=mix(uR.x,uR.y,aRing.y); vec4 w=uModel*vec4(cos(aRing.x)*r,0.0,sin(aRing.x)*r,1.0); vT=aRing.y; vWorld=w.xyz; gl_Position=uVP*w; }'
].join('\n');
var FS_RING = 'precision highp float;\n' + NOISE + '\n' + [
'varying float vT; varying vec3 vWorld;',
'uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uSunPos; uniform vec3 uPlanetPos; uniform float uPlanetR; uniform float uSeed; uniform float uGap; uniform float uOpacity;',
'void main(){ float r=vT;',
' float b=noise(vec3(r*55.0,uSeed,0.0))*0.55+noise(vec3(r*180.0,uSeed+3.0,0.0))*0.3+noise(vec3(r*600.0,uSeed+7.0,0.0))*0.15;',
' float a=smoothstep(0.0,0.05,r)*smoothstep(1.0,0.94,r)*(0.25+0.85*b);',
' a*=1.0-smoothstep(uGap-0.035,uGap-0.01,r)*(1.0-smoothstep(uGap+0.015,uGap+0.04,r))*0.94;',
' vec3 col=mix(uC2,uC1,b);',
' vec3 L=normalize(uSunPos-vWorld); vec3 oc=vWorld-uPlanetPos; float bb=dot(oc,L); float c=dot(oc,oc)-uPlanetR*uPlanetR; float disc=bb*bb-c;',
' float sh=1.0; if(disc>0.0 && -bb-sqrt(disc)>0.0) sh=0.1;',
' a*=uOpacity; gl_FragColor=vec4(col*sh*a,a); }'
].join('\n');

var VS_QUAD = [
'attribute vec2 aCorner; uniform mat4 uVP; uniform vec3 uCenter; uniform vec3 uRight; uniform vec3 uUp; uniform float uSize; varying vec2 vUv;',
'void main(){ vUv=aCorner; vec3 p=uCenter+(uRight*aCorner.x+uUp*aCorner.y)*uSize; gl_Position=uVP*vec4(p,1.0); }'
].join('\n');
var FS_GLOW = 'precision highp float;\n' + NOISE + '\n' + [
'varying vec2 vUv; uniform float uTime; uniform vec3 uTint; uniform float uRays;',
'void main(){ float d=length(vUv); float a=atan(vUv.y,vUv.x);',
' float glow=0.42*exp(-d*5.5)+0.22/(1.0+d*d*70.0);',
' float rays=noise(vec3(a*5.0,uTime*0.15,0.0))*noise(vec3(a*13.0,uTime*0.1,4.0)); rays=pow(rays,2.0)*exp(-d*4.0)*0.5;',
' vec3 col=uTint*(glow+rays*uRays)+mix(uTint,vec3(1.0),0.6)*exp(-d*13.0)*0.5;',
' col*=smoothstep(1.0,0.55,d); gl_FragColor=vec4(col,1.0); }'
].join('\n');

var VS_BG = 'attribute vec2 aCorner; varying vec2 vNdc; void main(){ vNdc=aCorner; gl_Position=vec4(aCorner,0.9999,1.0); }';
var FS_BG = 'precision highp float;\n' + NOISE + '\n' + [
'varying vec2 vNdc; uniform mat4 uInv;',
'void main(){ vec4 w=uInv*vec4(vNdc,1.0,1.0); vec3 dir=normalize(w.xyz/w.w);',
' float band=exp(-pow(dot(dir,normalize(vec3(0.35,1.0,0.25)))*3.2,2.0));',
' float f=fbm(dir*3.0); float f2=fbm(dir*8.0+2.0);',
' vec3 col=vec3(0.08,0.06,0.16)*band*f*f2*3.0+vec3(0.015,0.03,0.07)*fbm(dir*2.0+5.0)*0.7;',
' col+=vec3(0.28,0.22,0.36)*band*pow(f*f2,2.5)*3.0; col+=vec3(0.04,0.10,0.16)*pow(fbm(dir*1.5+9.0),3.0)*0.8;',
' gl_FragColor=vec4(col,1.0); }'
].join('\n');

var VS_STARS = [
'attribute vec3 position; attribute vec3 aCol; attribute vec2 aSB; uniform mat4 uVP; uniform float uDpr; uniform float uTime;',
'varying vec3 vCol;',
'void main(){ gl_Position=uVP*vec4(position,1.0); gl_PointSize=aSB.x*uDpr; vCol=aCol*aSB.y*(0.82+0.18*sin(uTime*1.7+position.x*0.37)); }'
].join('\n');
var FS_STARS = 'precision mediump float; varying vec3 vCol; void main(){ vec2 d=gl_PointCoord-0.5; float a=smoothstep(0.5,0.0,length(d)); gl_FragColor=vec4(vCol*a*a,1.0); }';

var VS_LINE = 'attribute vec3 position; uniform mat4 uVP; uniform mat4 uModel; void main(){ gl_Position=uVP*uModel*vec4(position,1.0); }';
var FS_LINE = 'precision mediump float; uniform vec4 uColor; void main(){ gl_FragColor=uColor; }';

var VS_SOLID = 'attribute vec3 position; attribute vec3 normal; uniform mat4 uVP; uniform mat4 uModel; varying vec3 vN; varying vec3 vW;'+
 'void main(){ vec4 w=uModel*vec4(position,1.0); vW=w.xyz; vN=(uModel*vec4(normal,0.0)).xyz; gl_Position=uVP*w; }';
var FS_SOLID = 'precision mediump float; varying vec3 vN; varying vec3 vW; uniform vec3 uColor; uniform vec3 uEmis; uniform vec3 uRim; uniform vec3 uCamPos;'+
 'void main(){ vec3 N=normalize(vN); vec3 V=normalize(uCamPos-vW); float hemi=0.5+0.5*N.y; float fr=pow(1.0-abs(dot(N,V)),3.0);'+
 ' float key=max(dot(N,normalize(vec3(-0.4,0.8,0.45))),0.0);'+
 ' vec3 c=uColor*(0.42+0.5*hemi)*(0.82+0.32*key)+uRim*fr+uEmis; gl_FragColor=vec4(c,1.0); }';

var VS_FLOOR = 'attribute vec3 position; uniform mat4 uVP; uniform mat4 uModel; varying vec3 vW; void main(){ vec4 w=uModel*vec4(position,1.0); vW=w.xyz; gl_Position=uVP*w; }';
var FS_FLOOR = 'precision highp float;\n' + NOISE + '\n' + [
'varying vec3 vW; uniform float uTime;',
'void main(){ vec2 p=vW.xz;',
' float row=floor(p.y/0.2); float off=hash(vec3(row,3.0,1.0))*1.2; float colm=floor((p.x+off)/1.2);',
' float fz=fract(p.y/0.2); float fx=fract((p.x+off)/1.2); float dz=min(fz,1.0-fz)*0.2; float dx=min(fx,1.0-fx)*1.2;',
' float seam=smoothstep(0.0015,0.005,min(dz,dx));',
' float grain=noise(vec3(p.x*2.5,p.y*45.0,row))*0.55+noise(vec3(p.x*18.0,p.y*90.0,row+7.0))*0.25;',
' vec3 wood=mix(vec3(0.56,0.40,0.27),vec3(0.70,0.53,0.36),hash(vec3(row,colm,2.0)))*(0.82+0.32*grain);',
' wood*=mix(0.55,1.0,seam);',

  if(panelA > .5) BTN.forEach(function(B){ cand(rayQuad(o, d, B.pos, PANEL.yaw, B.w/2, B.h/2), {kind:'btn', B:B}); });

        var rr = Math.hypot(rig.pos[0], rig.pos[2]); if(rr > 4.6){ rig.pos[0] *= 4.6/rr; rig.pos[2] *= 4.6/rr; }
      }
      if(src.handedness === 'right'){
        if(Math.abs(ax) > .7 && snapReady[i] !== false){
          var before = xform(rigMat(), headL); rig.yaw -= Math.sign(ax)*Math.PI/6;
          var after = xform(rigMat(), headL); rig.pos = add(rig.pos, sub(before, after)); snapReady[i] = false;
        } else if(Math.abs(ax) < .3) snapReady[i] = true;
      }
    }
    var RM = rigMat(), RI = inv(RM), rays = [];
    hover = null;
    for(i=0;i<s.inputSources.length;i++){
      var r = srcRay(frame, s.inputSources[i]); if(!r) continue;
      var h = pick(r.o, r.d), L = h ? h.t : 1.6;
      if(h && !hover) hover = h;
      if(h && h.kind === 'btn') h.B.hover = Math.max(h.B.hover, .6);
      if(h && h.kind === 'deskmenu') DESKBTN.hover = Math.max(DESKBTN.hover, .6);
      r.m = mul(r.m, trs([0,0,0], 0, 1, 1, L)); r.hit = h ? add(r.o, scl(r.d, h.t)) : null; rays.push(r);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    pose.views.forEach(function(v){
      var vp = xrLayer.getViewport(v); gl.viewport(vp.x, vp.y, vp.width, vp.height);
      var view = mul(new Float32Array(v.transform.inverse.matrix), RI);
      var eye = xform(RM, [v.transform.position.x, v.transform.position.y, v.transform.position.z]);
      renderView(new Float32Array(v.projectionMatrix), view, eye, vp.height, tn, rays);
    });
  } catch(err){ fail(err); }
}
if(navigator.xr && navigator.xr.isSessionSupported){
  navigator.xr.isSessionSupported('immersive-vr').then(function(ok){
    if(ok){ vrBtn.disabled = false; hintEl.textContent = 'Headset detectado. Toque em ENTRAR EM VR.'; }
  }).catch(function(){});
}
vrBtn.addEventListener('click', function(){ if(!xrSession) startXR(); });

    .then(redrawAllText).catch(function(){});
}
frame();
window.__aurora = {select:select, back:goBack, lesson:switchLesson, menu:toggleMenu, state:function(){ var L = menuLayout(); return {lesson:lesson, mode:mode, sel:sel, open:open, xr:!!xrSession, menuOpen:menu.open, bodies:BODIES.map(function(b){ return b.pos; }), btn:BTN.map(function(B){ return B.pos; }), deskbtn:DESKBTN.pos, cards:L.cards.map(function(c){ return c.pos; }), cell:CELL.map(function(c){ return localTo(cellMatrix(1), c.anchor); })}; }};

} catch(err){ fail(err); }
})();
